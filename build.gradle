plugins {
	// Minecraft 26.1+ is no longer obfuscated -> new Loom plugin id, no mappings needed
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add other repositories here if you need other mods as dependencies
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
	runs {
		client {
			client()
			name = "Minecraft Client"
			ideConfigGenerated = true
		}
	}
}

processResources {
	inputs.property "version", provider { project.version.toString() }

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// ---- automatic versioning ---------------------------------------------------------
// Every `gradlew build` (or `jar`) after a change in src/ raises mod_version in
// gradle.properties by 0.0.1 and produces a new jar (e.g. parz-1.0.7.jar). Without any
// change in src/ the version stays the same. Every jar is also copied to releases/.
def modPropsFile = file('gradle.properties')
def sourceHashFile = file('.gradle/parz-source-hash')

def computeSourceHash = {
	def digest = java.security.MessageDigest.getInstance('SHA-256')
	fileTree('src').files.sort { it.path }.each { f ->
		digest.update(projectDir.toPath().relativize(f.toPath()).toString().replace('\\', '/').getBytes('UTF-8'))
		digest.update(f.bytes)
	}
	return digest.digest().encodeHex().toString()
}

// .gradle/parz-source-hash holds two lines: the source hash and the version of the last
// SUCCESSFUL build. The next version is always derived from that, so a failed build never
// uses up a version number.
def pendingHash = null

gradle.taskGraph.whenReady { graph ->
	if (!graph.hasTask(':jar') && !graph.hasTask(':build')) {
		return
	}
	def currentHash = computeSourceHash()
	pendingHash = currentHash
	def propsText = modPropsFile.getText('UTF-8')
	def propsMatcher = propsText =~ /(?m)^mod_version\s*=\s*(\d+\.\d+\.\d+)\s*$/
	if (!propsMatcher.find()) {
		return
	}
	def propsVersion = propsMatcher.group(1)
	def stored = sourceHashFile.exists() ? sourceHashFile.readLines('UTF-8') : []
	def storedHash = stored.size() > 0 ? stored[0].trim() : null
	def storedVersion = stored.size() > 1 ? stored[1].trim() : propsVersion

	def targetVersion = storedVersion
	if (storedHash != null && storedHash != currentHash) {
		def parts = storedVersion.tokenize('.')
		targetVersion = "${parts[0]}.${parts[1]}.${parts[2].toInteger() + 1}"
	}
	if (targetVersion != propsVersion) {
		modPropsFile.setText(propsText.replaceFirst(/(?m)^mod_version\s*=.*$/, "mod_version=${targetVersion}"), 'UTF-8')
		logger.lifecycle("Parz version is now ${targetVersion}")
	}
	project.version = targetVersion
}

tasks.named('jar') {
	doLast {
		if (pendingHash != null) {
			sourceHashFile.parentFile.mkdirs()
			sourceHashFile.setText(pendingHash + System.lineSeparator() + project.version, 'UTF-8')
		}
	}
}

tasks.register('copyReleaseJar', Copy) {
	from(tasks.named('jar'))
	into(layout.projectDirectory.dir('releases'))
}

// Old versions in build/libs are moved into build/libs/Müll as soon as a new one is built.
tasks.register('archiveOldJars') {
	doLast {
		def libs = layout.buildDirectory.dir('libs').get().asFile
		def trash = new File(libs, 'Müll')
		def current = ["${base.archivesName.get()}-${project.version}.jar".toString(),
					   "${base.archivesName.get()}-${project.version}-sources.jar".toString()]
		(libs.listFiles() ?: new File[0]).findAll { it.isFile() && it.name.endsWith('.jar') && !(it.name in current) }.each { old ->
			trash.mkdirs()
			java.nio.file.Files.move(old.toPath(), new File(trash, old.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			logger.lifecycle("Moved ${old.name} to Müll")
		}
	}
}

// ---- only the newest 3 versions are kept -----------------------------------------------
def compareVersions = { String a, String b ->
	def pa = a.tokenize('.').collect { it.toInteger() }
	def pb = b.tokenize('.').collect { it.toInteger() }
	for (int i = 0; i < Math.max(pa.size(), pb.size()); i++) {
		int x = i < pa.size() ? pa[i] : 0
		int y = i < pb.size() ? pb[i] : 0
		if (x != y) {
			return x <=> y
		}
	}
	return 0
}

// Deletes the jars of every version except the newest 3 (releases/, build/libs and build/libs/Müll).
tasks.register('pruneOldVersions') {
	mustRunAfter 'copyReleaseJar', 'archiveOldJars'
	doLast {
		def jarPattern = java.util.regex.Pattern.compile('^' + java.util.regex.Pattern.quote(base.archivesName.get()) + '-(\\d+\\.\\d+\\.\\d+)(-sources)?\\.jar$')
		def libs = layout.buildDirectory.dir('libs').get().asFile
		def dirs = [file('releases'), libs, new File(libs, 'Müll')]
		def found = []
		dirs.each { dir ->
			(dir.listFiles() ?: new File[0]).each { f ->
				def m = jarPattern.matcher(f.name)
				if (f.isFile() && m.matches()) {
					found << [file: f, version: m.group(1)]
				}
			}
		}
		def versions = found.collect { it.version }.unique().sort { a, b -> compareVersions(b, a) }
		def keep = versions.take(3)
		found.findAll { !(it.version in keep) }.each {
			it.file.delete()
			logger.lifecycle("Deleted old version ${it.file.name}")
		}
	}
}

// ---- upload to GitHub -------------------------------------------------------------------
// After a build of a version that is not on GitHub yet: commit + push the mod files, create the release
// v<version> with the jar attached and delete releases older than the newest 3.
// Never fails the build (offline, not logged in, ...). Skip it with: gradlew build -PnoPublish
tasks.register('publishRelease') {
	mustRunAfter 'copyReleaseJar', 'archiveOldJars', 'pruneOldVersions'
	doLast {
		if (project.hasProperty('noPublish')) {
			logger.lifecycle('GitHub upload skipped (-PnoPublish)')
			return
		}
		def ghExe = new File('C:/Program Files/GitHub CLI/gh.exe').exists() ? 'C:/Program Files/GitHub CLI/gh.exe' : 'gh'
		def run = { List<String> cmd ->
			try {
				def process = new ProcessBuilder(cmd).directory(projectDir).redirectErrorStream(true).start()
				def out = process.inputStream.getText('UTF-8')
				return [process.waitFor(), out.trim()]
			} catch (Exception e) {
				return [-1, String.valueOf(e.message)]
			}
		}
		def version = project.version.toString()
		def tag = "v${version}".toString()
		def jarFile = tasks.named('jar').get().archiveFile.get().asFile
		try {
			def view = run([ghExe, 'release', 'view', tag])
			if (view[0] != 0) {
				if (!view[1].contains('release not found')) {
					logger.warn("GitHub upload skipped: ${view[1]}")
					return
				}
				// the commit must never carry the real email address
				def email = run(['git', 'config', 'user.email'])[1]
				if (!email.contains('noreply')) {
					logger.warn('GitHub upload skipped: git user.email in this repository is not the GitHub noreply address')
					return
				}
				def paths = ['src', 'build.gradle', 'settings.gradle', 'gradle.properties', '.gitignore'].findAll { file(it).exists() }
				run(['git', 'add', '--'] + paths)
				if (run(['git', 'diff', '--cached', '--quiet'])[0] != 0) {
					def commit = run(['git', 'commit', '-m', "Release ${tag}".toString()])
					if (commit[0] != 0) {
						logger.warn("GitHub upload stopped: commit failed: ${commit[1]}")
						return
					}
				}
				def push = run(['git', 'push', 'origin', 'HEAD'])
				if (push[0] != 0) {
					logger.warn("GitHub upload stopped: push failed: ${push[1]}")
					return
				}
				def sha = run(['git', 'rev-parse', 'HEAD'])[1]
				def create = run([ghExe, 'release', 'create', tag, jarFile.absolutePath, '--target', sha,
								  '--title', "Parz ${version}".toString(), '--notes', "Automatic build of Parz ${version}.".toString()])
				if (create[0] != 0) {
					logger.warn("GitHub release failed: ${create[1]}")
					return
				}
				logger.lifecycle("Uploaded ${tag} to GitHub: ${create[1]}")
			}

			// delete releases older than the newest 3
			def list = run([ghExe, 'release', 'list', '--limit', '100', '--json', 'tagName'])
			if (list[0] == 0) {
				def tags = new groovy.json.JsonSlurper().parseText(list[1]).collect { it.tagName as String }
						.findAll { it ==~ /v\d+\.\d+\.\d+/ }
						.sort { a, b -> compareVersions(b.substring(1), a.substring(1)) }
				tags.drop(3).each { old ->
					def del = run([ghExe, 'release', 'delete', old, '--yes', '--cleanup-tag'])
					logger.lifecycle(del[0] == 0 ? "Deleted old GitHub release ${old}" : "Could not delete ${old}: ${del[1]}")
				}
			}
		} catch (Exception e) {
			logger.warn("GitHub upload failed: ${e.message}")
		}
	}
}

tasks.named('build') {
	finalizedBy 'copyReleaseJar', 'archiveOldJars', 'pruneOldVersions', 'publishRelease'
}
